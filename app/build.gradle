plugins { id 'com.android.application' }
android {
    namespace 'dev.icecommander'
    compileSdk 36
    defaultConfig { applicationId 'dev.icecommander'; minSdk 26; targetSdk 36; versionCode 1; versionName '0.1.0' }
    buildFeatures { aidl true; buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true; unitTests.includeAndroidResources = true }
}
dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
